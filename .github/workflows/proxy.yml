name: deploy proxy
# 通用事件面执行器：webhook → Worker/Pages Function → repository_dispatch(site-deploy)
#   payload: { site: "<注册表键>", branch: "main"|"cps-test" }
# 站点配置来自私有 hub 的 tasks/sites.json（新增站点只加一行 + 密钥，不改本文件）
on:
  repository_dispatch:
    types: [site-deploy]
  workflow_dispatch:
    inputs:
      site:
        description: "站点点键（见 hub tasks/sites.json）"
        required: true
      branch:
        description: "main=生产 / cps-test=预览"
        default: "cps-test"
concurrency:
  group: proxy-${{ github.event.client_payload.site || github.event.inputs.site }}-${{ github.event.client_payload.branch || github.event.inputs.branch }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HUB_KEY: ${{ secrets.PROXY_HUB_KEY }}
      SITE_KEYS: ${{ secrets.PROXY_KEYS_JSON }}
      SITE: ${{ github.event.client_payload.site || github.event.inputs.site }}
      BRANCH: ${{ github.event.client_payload.branch || github.event.inputs.branch || 'cps-test' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
      DRAMACPS_EMAIL: ${{ secrets.DRAMACPS_EMAIL }}
      DRAMACPS_PASSWORD: ${{ secrets.DRAMACPS_PASSWORD }}
      YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}
    steps:
      - name: 取站点配置（私有 hub）
        run: |
          mkdir -p ~/.ssh && printf '%s' "$HUB_KEY" > ~/.ssh/hub_dk && chmod 600 ~/.ssh/hub_dk
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/hub_dk -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:greatyingzi/data-core-01.git hub
          python3 - <<'PY'
          import json, os
          cfg = json.load(open("hub/tasks/sites.json"))["sites"]
          site = os.environ["SITE"]
          if site not in cfg:
              raise SystemExit("未知站点: %s（可用: %s）" % (site, ",".join(cfg)))
          s = cfg[site]
          if not s.get("enabled", True):
              raise SystemExit("站点已禁用: %s" % site)
          out = open(os.environ["GITHUB_ENV"], "a")
          out.write("SITE_REPO=%s\n" % s["repo"])
          out.write("SITE_PROJECT=%s\n" % s["project"])
          out.write("SITE_PROD=%s\n" % s.get("prod", ""))
          out.write("SITE_PREVIEW=%s\n" % s.get("preview", ""))
          out.write("SITE_PIP=%s\n" % s.get("pip", ""))
          out.write("SITE_BUILD=%s\n" % s["build"])
          out.write("SITE_GATE_PROD=%s\n" % s.get("gate_prod", ""))
          out.write("SITE_GATE_PREVIEW=%s\n" % s.get("gate_preview", ""))
          out.close()
          print("site:", site, "-> repo:", s["repo"], "project:", s["project"])
          PY
      - name: 站点 deploy key
        run: |
          python3 - <<'PY'
          import json, os
          keys = json.loads(os.environ.get("SITE_KEYS") or "{}")
          site = os.environ["SITE"]
          if site not in keys:
              raise SystemExit("缺少 %s 的 deploy key（PROXY_KEYS_JSON）" % site)
          p = os.path.expanduser("~/.ssh/site_dk")
          open(p, "w").write(keys[site])
          os.chmod(p, 0o600)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("GIT_SSH_COMMAND=ssh -i %s -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new\n" % p)
          PY
          git config --global user.name "proxy-bot"
          git config --global user.email "bot@users.noreply.github.com"
      - name: 拉站点仓
        run: git clone --depth 1 git@github.com:greatyingzi/"$SITE_REPO".git site
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: 依赖
        run: pip install -q $SITE_PIP || true
      - name: 构建
        working-directory: site
        run: |
          if [ "$BRANCH" = "main" ]; then BASE="$SITE_PROD"; else BASE="$SITE_PREVIEW"; fi
          echo "target=$BASE"
          BASE="$BASE" sh -c "$SITE_BUILD"
          if [ "$BRANCH" = "main" ]; then sh -c "$SITE_GATE_PROD"; else sh -c "$SITE_GATE_PREVIEW"; fi
      - name: 部署
        working-directory: site
        run: npx --yes wrangler@3 pages deploy dist --project-name="$SITE_PROJECT" --branch="$BRANCH" --commit-dirty=true
      - name: 线上校验
        run: |
          if [ "$BRANCH" = "main" ]; then U="$SITE_PROD"; else U="$SITE_PREVIEW"; fi
          for _ in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$U")
            echo "$U -> $code"; [ "$code" = "200" ] && exit 0; sleep 15
          done; exit 1
